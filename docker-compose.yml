version: "3.8"
services:
  mongodb:
    container_name: mongo-service
    image: mongo:latest
    volumes:
      - ./server/data:/data
    ports:
      - "27017:27017"

  backend:
    container_name: backend
    build: ./server
    env_file:
      - ./server/.env.docker
    ports:
      - "31100:8080"
    depends_on:
      - mongodb

  frontend:
    container_name: frontend
    build: ./client
    env_file:
      - ./client/.env.docker
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    container_name: redis-service
    restart: unless-stopped
    image: redis:7.0.5-alpine
    expose:
      - 6379
    depends_on:
      - mongodb

volumes:
  data:
